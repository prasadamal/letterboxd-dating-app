name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the lockfile's tested npm version
        run: npm install --global npm@11.9.0
      - run: npm ci
      - run: node scripts/state-index.mjs --check
      - run: npm test
      - name: Session functions against both shapes of the refresh_tokens table (PostgreSQL)
        run: |
          sudo systemctl start postgresql.service
          pg_isready --timeout=30
          ./scripts/test-auth-functions.sh
      - run: npm run build
      - name: Mobile typecheck
        run: |
          cd mobile
          npm ci
          npm run typecheck
          npm test
          npm run lint
          npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/mobile-bundles"
