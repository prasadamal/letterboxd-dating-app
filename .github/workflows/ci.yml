name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/state-index.mjs --check
      - run: npm test
      - run: npm run build
      - name: Mobile typecheck
        run: |
          cd mobile
          npm ci
          npm run typecheck
          npm test
          npm run lint
          npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/mobile-bundles"
