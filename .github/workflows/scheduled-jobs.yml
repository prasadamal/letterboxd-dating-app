name: Scheduled jobs

# Calls the API's cron endpoints. Needs two repository secrets (Settings → Secrets and variables → Actions):
#   REELMATES_API_URL   e.g. https://reelmates-api.onrender.com   (no trailing slash, no /api)
#   REELMATES_CRON_SECRET  the CRON_SECRET value from the API host
# Without them the jobs skip quietly.
on:
  schedule:
    - cron: '0 17 * * *' # daily game reminder push, 17:00 UTC
    - cron: '30 3 * * 1' # weekly: pause matchmaking for inactive accounts
  workflow_dispatch:
    inputs:
      job:
        description: Job to run now
        type: choice
        options: [daily-reminders, inactivity-cleanup]
        default: daily-reminders

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call API
        env:
          API_URL: ${{ secrets.REELMATES_API_URL }}
          CRON_SECRET: ${{ secrets.REELMATES_CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_JOB: ${{ inputs.job }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "REELMATES_API_URL / REELMATES_CRON_SECRET not set; skipping."
            exit 0
          fi
          if [ -n "$MANUAL_JOB" ]; then job="$MANUAL_JOB"
          elif [ "$SCHEDULE" = "30 3 * * 1" ]; then job=inactivity-cleanup
          else job=daily-reminders; fi
          # Retries cover a sleeping free-tier instance waking up.
          curl -fsS --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "$API_URL/api/v1/internal/$job" -H "x-cron-secret: $CRON_SECRET"
